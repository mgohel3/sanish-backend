map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name staging.sanishlaminate.com sanishlaminate.com www.sanishlaminate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Old addresses → the live site ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.sanishlaminate.com;
    ssl_certificate     /etc/letsencrypt/live/sanishlaminate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanishlaminate.com/privkey.pem;
    return 301 https://sanishlaminate.com$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name staging.sanishlaminate.com;
    ssl_certificate     /etc/letsencrypt/live/staging.sanishlaminate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.sanishlaminate.com/privkey.pem;
    return 301 https://sanishlaminate.com$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name sanishlaminate.com;

    ssl_certificate     /etc/letsencrypt/live/sanishlaminate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanishlaminate.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    # ── Public API + assets (no auth: needed for SSR + browser) ────────────
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /media/ {
        alias /var/www/media/;
        access_log off;
        # Product images get overwritten in place at the same filename when a
        # photo is corrected (see the 2026-09-22 CMYK colour-cast fix) — a long
        # max-age silently kept serving the old file from cache for up to 7
        # days. "no-cache" makes the browser always revalidate first (a cheap
        # local round-trip, 304 if unchanged) instead of trusting a stale copy.
        add_header Cache-Control "public, max-age=604800"; # CMS uploads get a new file name when replaced
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }

    # ── Protected admin surfaces ─────────────────────────────────────────
    location ^~ /cms/ {
        # Event videos (Media Library uploads) are far bigger than the 25m
        # site-wide cap; only the authenticated CMS needs the higher limit.
        client_max_body_size 250m;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /django-admin/ {
        auth_basic "Sanish CMS";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /ckeditor5/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }

    # ── Static images/fonts of the site: let browsers keep them for a week (Next sends max-age=0) ──
    location ~* ^/assets/.*\.(jpg|jpeg|png|webp|avif|svg|gif|woff2?|ico)$ {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/_proxy.inc;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── The site (Next.js) — behind basic auth so staging stays private ──
    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
}
