map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name staging.sanishlaminate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name staging.sanishlaminate.com;

    ssl_certificate     /etc/letsencrypt/live/staging.sanishlaminate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.sanishlaminate.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    # Hard staging robots — keep the whole site out of search indexes.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Public API + assets (no auth: needed for SSR + browser) ────────────
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }

    # ── Protected admin surfaces ─────────────────────────────────────────
    location ^~ /cms/ {
        auth_basic "Sanish staging";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /django-admin/ {
        auth_basic "Sanish staging";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
    location ^~ /ckeditor5/ {
        auth_basic "Sanish staging";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy.inc;
    }

    # ── The site (Next.js) — behind basic auth so staging stays private ──
    location / {
        auth_basic "Sanish staging";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
}
