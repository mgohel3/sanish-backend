# Compress text responses (the stock nginx.conf has gzip commented out). Responses that already carry
# Content-Encoding (e.g. Next.js gzip) are left alone; images/video are already compressed so they are not listed.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject application/manifest+json;
