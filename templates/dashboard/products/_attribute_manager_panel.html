<div x-show="open" x-cloak x-transition
     class="mt-2 p-3 rounded-xl border border-gray-100 dark:border-dark-600 bg-gray-50 dark:bg-dark-700/40 space-y-2">
  <p class="text-xs text-gray-400">Drag to reorder. Removing an option won't change products already using it.</p>
  <ul class="space-y-1" x-ref="list" x-init="initSort($refs.list)">
    <template x-for="opt in options" :key="opt.id">
      <li :data-id="opt.id" class="flex items-center gap-2 bg-white dark:bg-dark-800 rounded-lg px-2 py-1.5 text-sm">
        <span class="drag-handle cursor-grab text-gray-300 hover:text-gray-500 select-none" title="Drag to reorder">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>
        </span>
        <span class="flex-1 truncate" x-text="opt.value"></span>
        <button type="button" @click="remove(opt.id)" class="text-red-400 hover:text-red-600 text-xs shrink-0">Remove</button>
      </li>
    </template>
    <li x-show="options.length === 0" class="text-xs text-gray-400 text-center py-2">No options yet.</li>
  </ul>
  <div class="flex gap-2 pt-1">
    <input type="text" x-model="newValue" @keydown.enter.prevent="add()"
           placeholder="Add new option…" class="form-input flex-1 text-sm py-1.5"/>
    <button type="button" @click="add()" class="btn-secondary text-xs px-3 shrink-0">Add</button>
  </div>
</div>
