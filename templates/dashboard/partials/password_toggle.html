<script>
  // Adds a show/hide eye toggle to every password field in the CMS, including
  // ones rendered later by Alpine/HTMX — no per-form wiring needed.
  (function () {
    const EYE_OPEN = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
    const EYE_OFF = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.58 10.58a2 2 0 002.83 2.83M9.88 5.09A9.77 9.77 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.4 10.4 0 01-2.293 3.95M6.61 6.61C4.6 7.9 3.127 9.79 2.458 12c.508 1.62 1.42 3.09 2.618 4.27"/></svg>';

    function wrap(input) {
      if (input.dataset.pwToggled) return;
      input.dataset.pwToggled = '1';

      const wrapper = document.createElement('div');
      wrapper.className = 'relative';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);

      const existingPad = window.getComputedStyle(input).paddingRight;
      input.style.paddingRight = `calc(${existingPad} + 28px)`;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.tabIndex = -1;
      btn.className = 'absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200';
      btn.innerHTML = EYE_OPEN;
      btn.addEventListener('click', () => {
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.innerHTML = showing ? EYE_OPEN : EYE_OFF;
      });
      wrapper.appendChild(btn);
    }

    function scan(root) {
      root.querySelectorAll('input[type="password"]').forEach(wrap);
    }

    document.addEventListener('DOMContentLoaded', () => scan(document));
    new MutationObserver((mutations) => {
      mutations.forEach((m) => m.addedNodes.forEach((n) => {
        if (n.nodeType === 1) {
          if (n.matches && n.matches('input[type="password"]')) wrap(n);
          if (n.querySelectorAll) scan(n);
        }
      }));
    }).observe(document.body, { childList: true, subtree: true });
  })();
</script>
