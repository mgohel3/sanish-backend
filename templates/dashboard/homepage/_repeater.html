{% load homepage_extras %}
{# Alpine-driven list editor. Serialises to a hidden <field>_json textarea. #}
<div x-data='{
       rows: {{ values|dictkey:field.name|jsonify }},
       blank() { return {{ field.fields|jsonify_blank }} },
       add() { this.rows.push(this.blank()); },
       remove(i) { this.rows.splice(i, 1); },
       move(i, d) {
         const j = i + d;
         if (j < 0 || j >= this.rows.length) return;
         const r = this.rows.splice(i, 1)[0];
         this.rows.splice(j, 0, r);
       },
       get serialised() { return JSON.stringify(this.rows); }
     }'
     class="space-y-3">

  <input type="hidden" name="{{ field.name }}_json" :value="serialised" />

  <template x-for="(row, i) in rows" :key="i">
    <div class="rounded-2xl border border-gray-200 dark:border-dark-600 p-4 space-y-3 bg-surface-50 dark:bg-dark-700/40">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-gray-400" x-text="'#' + (i + 1)"></span>
        <div class="flex gap-1">
          <button type="button" class="btn-ghost !px-2 !py-1 text-xs" @click="move(i, -1)">↑</button>
          <button type="button" class="btn-ghost !px-2 !py-1 text-xs" @click="move(i, 1)">↓</button>
          <button type="button" class="btn-ghost !px-2 !py-1 text-xs text-red-500" @click="remove(i)">Remove</button>
        </div>
      </div>

      {% for sf in field.fields %}
      <div{% if sf.hide_if %} x-show="!rows[i]['{{ sf.hide_if }}']" x-cloak{% endif %}>
        <label class="form-label !text-[10px]">{{ sf.label }}</label>
        {% if sf.type == "textarea" %}
          <textarea rows="2" class="form-input text-sm resize-y" x-model="rows[i]['{{ sf.name }}']"></textarea>
        {% elif sf.type == "select" %}
          <select class="form-input text-sm" x-model{% if sf.bool_select %}.boolean{% endif %}="rows[i]['{{ sf.name }}']">
            {% for opt in sf.options %}
            <option value="{{ opt.value }}">{{ opt.label }}</option>
            {% endfor %}
          </select>
        {% elif sf.type == "bool" %}
          <input type="checkbox" class="rounded border-gray-300" x-model="rows[i]['{{ sf.name }}']" />
        {% elif sf.type == "image" or sf.type == "video" or sf.type == "media" %}
          <div class="mp-field flex gap-2">
            <input type="text" class="form-input text-sm flex-1" x-model="rows[i]['{{ sf.name }}']" />
            <button type="button" class="btn-secondary text-xs whitespace-nowrap"
                    onclick="openMediaPicker({ el: this.closest('.mp-field').querySelector('input'), accept: '{% if sf.type == 'video' %}video{% else %}image{% endif %}' })">
              Library
            </button>
          </div>
        {% else %}
          <input type="text" class="form-input text-sm" x-model="rows[i]['{{ sf.name }}']" />
        {% endif %}
        {% if sf.help %}<p class="text-[10px] text-gray-400 mt-1">{{ sf.help }}</p>{% endif %}
        {% if sf.help_when_true or sf.help_when_false %}
        <p class="text-[10px] text-gray-400 mt-1" x-show="!!rows[i]['{{ sf.show_key|default:sf.name }}']" x-cloak>{{ sf.help_when_true }}</p>
        <p class="text-[10px] text-gray-400 mt-1" x-show="!rows[i]['{{ sf.show_key|default:sf.name }}']" x-cloak>{{ sf.help_when_false }}</p>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </template>

  <button type="button" class="btn-secondary text-xs" @click="add()">+ Add item</button>
</div>
